<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iQ Store | App Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabecera estilo Play Store -->
    <header>
        <div class="logo" onclick="location.reload()">iQ<span>Store</span></div>
        
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Buscar aplicaciones y juegos...">
        </div>

        <div class="header-actions">
            <div class="bell-icon" onclick="toggleNotifications()">
                <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
                <div class="bell-badge" id="bellBadge"></div>
            </div>
            <img src="https://ui-avatars.com/api/?name=User&background=00E359&color=000" class="profile-pic" alt="Perfil">
        </div>
    </header>

    <!-- Panel de Notificaciones -->
    <div class="notifications-panel" id="notifPanel">
        <div class="notif-header">Novedades y Actualizaciones</div>
        <div id="notifList"></div>
    </div>

    <!-- Navegación por Pestañas (Tabs) -->
    <nav class="tabs">
        <button class="tab-btn active" data-target="Inicio">Para ti</button>
        <button class="tab-btn" data-target="Juegos">Juegos</button>
        <button class="tab-btn" data-target="Entretenimiento">Apps</button>
        <button class="tab-btn" data-target="Herramientas">Herramientas</button>
    </nav>

    <!-- Contenedor Principal donde se inyecta el contenido -->
    <main id="mainContainer">
        <!-- Loader inicial -->
        <div style="text-align:center; padding: 50px; color: var(--iqiyi-green);">Cargando tienda...</div>
    </main>

    <!-- Modal Detalles App -->
    <div class="modal-overlay" id="appModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="modalContentDynamic"></div>
        </div>
    </div>

    <!-- Script en archivo externo -->
    <script src="app.js"></script>
</body>
</html>
